<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Home</title>
    <meta name="description"
      content="Explore our thrilling white water rafting trips, from beginner scenic floats to advanced rapid challenges.">
    <meta name="author" content="Glory Simeon">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/site-logo.webp" alt="site logo" width="80">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/hero-image.webp" alt="hero-image">
            <article>
                <h1>Your Adventure Begins Here!</h1>
                <p>Join us for the ultimate white water rafting experience tailored for all skill
                    levels.</p>
                <a href="trips.html" class="book-trips">Book Your Trips Now</a>
            </article>
        </div>
        <form>
            <fieldset>
                <legend>Visitors Information</legend>
                <div class="visitors-info">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="visitors-info">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </fieldset>
            <button type="submit">Subscribe</button>
        </form>
        <section class="home-grid">
            <figure>
                <img src="images/best-experience.webp" alt="Yellow raft navigating rapids">
                <figcaption>Best Experience</figcaption>
                <p>Conquer thrilling river rapids and enjoy stunning nature! Our guided trips
                    deliver non-stop
                    adventure for every thrill-seeker.</p>
            </figure>
            <figure>
                <img src="images/guide-tour.webp" alt="Two paddlers with life jackets">
                <figcaption>Your Guide Tour</figcaption>
                <p>Your safety comes first. Our certified guides provide top-tier gear and expert
                    instruction so you
                    can paddle with confidence.</p>
            </figure>

        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting, Glory Simeon</p>
        <nav class="socialmedia">
            <a href="https://web.facebook.com"><img src="images/facebook.webp" alt="Facebook Icon"
                  width="45"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.webp"
                  alt="Instagram Icon" width="30"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin.webp" alt="Linkedin Icon"
                  width="28"></a>
        </nav>
    </footer>
</body>

</html>
