<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content=" Get in touch with White Water Rafting Company. Find our address, phone number, location map, and contact form for inquiries and reservations">
    <meta name="author" content="Glory Simeon">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/site-logo.webp" alt="site logo" width="80">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>Suite 235 Rivtaf Shopping Mall, Golf Estate</p>
            <p>Port Harcourt, Rivers State</p>
            <p>+234-703-829-0081</p>
            <p><a href="mailto:info@waterrafting.com">info@waterrafting.com</a></p>
        </section>
        <div class="contact">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.8209866771967!2d7.053970478718716!3d4.800768651384061!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1069cdbef00f6e0d%3A0x6e59e5b966a76559!2sElfrida%20Park%20Limited!5e0!3m2!1sen!2sng!4v1790780344885!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>

                    <div class="contact-item">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="contact-item">
                        <label for="email">Email:</label>
                        <input type="text" id="email" name="email" required>
                    </div>
                </fieldset>
                <fieldset>

                    <div class="contact-item">
                        <label for="message purpose">Message Purpose:</label>
                        <select name="message purpose" id="message purpose">
                            <option value="" selected disabled>Choose One...</option>
                            <option value="a">General Inquiry</option>
                            <option value="">Reservation Question</option>
                            <option value="">Website Suggestion</option>
                        </select>
                    </div>

                    <div class="contact-item">
                        <label for="message">Message:</label>
                        <textarea name="message" id="message">Type here</textarea>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>

                    </div>
                </fieldset>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees-profile">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-grid">
                <figure>
                    <img src="images/ceo.webp" alt="ceo">
                    <figcaption>Glory Simeon</figcaption>
                    <p>CEO</p>
                </figure>
                <figure>
                    <img src="images/safety-officer.webp" alt="safety-officer">
                    <figcaption>Fred Chukwu</figcaption>
                    <p>Safety Officer</p>
                </figure>
                <figure>
                    <img src="images/logistics-manager.webp" alt="logistics-manager">
                    <figcaption>Joke Adewale</figcaption>
                    <p>Logistics Manager</p>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting, Glory Simeon</p>
        <nav class="socialmedia">
            <a href="https://web.facebook.com">
                <img src="images/facebook.webp" alt="Facebook Icon" width="45"></a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.webp" alt="Instagram Icon" width="30"></a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.webp" alt="Linkedin Icon" width="28"></a>
        </nav>
    </footer>
</body>

</html>
