<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content=" Get in touch with White Water Rafting Company. Find our address, phone number, location map, and contact form for inquiries and reservations">
    <meta name="author" content="Glory Simeon">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/site-logo.webp" alt="site logo" width="80">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>Suite 235 Rivtaf Shopping Mall, Golf Estate</p>
            <p>Port Harcourt, Rivers State</p>
            <p>+234-703-829-0081</p>
            <p><a href="mailto:info@waterrafting.com">info@waterrafting.com</a></p>
        </section>
        <div class="contact">
            <div class="map">
                <a href="https://maps.google.com/?q=Suite+235+Rivtaf+Shopping+Mall+Golf+Estate+Port+Harcourt"
                  target="_blank" rel="noopener">
                    <img src="images/map.webp"
                      alt="Map Showing office location at Rivtaf Shopping Mall" width="600"
                      height="400">
                </a>
            </div>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="contact-item">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="contact-item">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="radio-group">
                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="website" name="purpose" value="website">
                        <label for="website">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="contact-item">
                    <label for="message">Message:</label>
                    <textarea name="message" id="message">Type here</textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees-profile">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-grid">
                <figure>
                    <img src="images/ceo.webp" alt="Glory Simeon, CEO">
                    <figcaption>Glory Simeon</figcaption>
                    <p>CEO</p>
                </figure>
                <figure>
                    <img src="images/safety-officer.webp" alt="Fred Chukwu, Safety Officer">
                    <figcaption>Fred Chukwu</figcaption>
                    <p>Safety Officer</p>
                </figure>
                <figure>
                    <img src="images/logistics-manager.webp" alt="Joke Adewale, Logistics Manager">
                    <figcaption>Joke Adewale</figcaption>
                    <p>Logistics Manager</p>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting, Glory Simeon</p>
        <nav class="socialmedia">
            <a href="https://web.facebook.com"><img src="images/facebook.webp" alt="Facebook Icon"
                  width="45"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.webp"
                  alt="Instagram Icon" width="30"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin.webp" alt="Linkedin Icon"
                  width="28"></a>
        </nav>
    </footer>
</body>

</html>
